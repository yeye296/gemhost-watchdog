name: gemhost-watchdog

# GemHost 免费服保活：定时查状态，offline 就 power start。
# 唯一的定时器是 cron-job.org 外部腿（本账号 GA 原生 schedule 不 fire），
# 所以这里故意不写 on: schedule，避免停腿后还有第二条腿在跑。
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'cron 腿填 cron（成功静默）；手动触发留空（推一条结果）'
        required: false
        default: 'manual'

concurrency:
  group: gemhost-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 探测 + 必要时拉起
        env:
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_PW: ${{ secrets.GH_PW }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: python3 watch.py

      - name: run 摘要
        if: always()
        run: echo "- $(date -u '+%F %T UTC') gemhost watchdog done" >> "$GITHUB_STEP_SUMMARY"
