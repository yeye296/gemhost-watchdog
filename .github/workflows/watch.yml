name: gemhost-watchdog

# GemHost 免费服保活：定时查状态，offline 就 power start。
# 唯一的定时器是 cron-job.org 外部腿（本账号 GA 原生 schedule 不 fire），
# 所以这里故意不写 on: schedule，避免停腿后还有第二条腿在跑。
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'cron 腿填 cron（成功静默）；手动触发留空（推一条结果）'
        required: false
        default: 'cron'

concurrency:
  group: gemhost-watchdog
  cancel-in-progress: false

permissions:
  actions: write  
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 探测 + 必要时拉起
        env:
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_PW: ${{ secrets.GH_PW }}
          GH_SID: ${{ secrets.GH_SID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: python3 watch.py

      # --- 新增的防暂停代码开始 ---
      - name: Commit time.txt to repo
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi
          
          git add time.txt
          
          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
      # --- 新增的防暂停代码结束 ---
